<!-- index.html -->
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Standalone Three.js WebGPU volumetric clouds demo"
    />
    <title>WebGPU Clouds</title>
  </head>
  <body>
    <main id="app" aria-label="WebGPU clouds demo"></main>

    <aside class="panel" aria-label="Cloud controls">
      <header>
        <p class="eyebrow">Three.js WebGPU</p>
        <h1>Volumetric clouds</h1>
        <p id="status" class="status">Initializing WebGPU…</p>
      </header>

      <section class="control-group" aria-labelledby="cloud-controls-heading">
        <h2 id="cloud-controls-heading">Clouds</h2>

        <label>
          <span>Coverage <output id="coverage-value">0.40</output></span>
          <input
            id="coverage"
            type="range"
            min="0"
            max="1"
            step="0.01"
            value="0.4"
          />
        </label>

        <label class="toggle">
          <span>Animate weather</span>
          <input id="animate-weather" type="checkbox" />
        </label>
      </section>

      <section class="control-group" aria-labelledby="layer-controls-heading">
        <h2 id="layer-controls-heading">Layers</h2>
        <p class="hint">Defaults: low (r), mid (g), high cirrus (b). Values are meters.</p>

        <details open>
          <summary>Low (r)</summary>
          <label>
            <span>Altitude <output id="layer-0-altitude-value">750</output> m</span>
            <input id="layer-0-altitude" type="range" min="0" max="4000" step="50" value="750" />
          </label>
          <label>
            <span>Height <output id="layer-0-height-value">650</output> m</span>
            <input id="layer-0-height" type="range" min="50" max="3000" step="50" value="650" />
          </label>
          <label>
            <span>Density <output id="layer-0-density-value">0.20</output></span>
            <input id="layer-0-density" type="range" min="0" max="1" step="0.01" value="0.2" />
          </label>
        </details>

        <details>
          <summary>Mid (g)</summary>
          <label>
            <span>Altitude <output id="layer-1-altitude-value">1000</output> m</span>
            <input id="layer-1-altitude" type="range" min="0" max="5000" step="50" value="1000" />
          </label>
          <label>
            <span>Height <output id="layer-1-height-value">1200</output> m</span>
            <input id="layer-1-height" type="range" min="50" max="4000" step="50" value="1200" />
          </label>
          <label>
            <span>Density <output id="layer-1-density-value">0.20</output></span>
            <input id="layer-1-density" type="range" min="0" max="1" step="0.01" value="0.2" />
          </label>
        </details>

        <details>
          <summary>High (b)</summary>
          <label>
            <span>Altitude <output id="layer-2-altitude-value">7500</output> m</span>
            <input id="layer-2-altitude" type="range" min="2000" max="12000" step="100" value="7500" />
          </label>
          <label>
            <span>Height <output id="layer-2-height-value">500</output> m</span>
            <input id="layer-2-height" type="range" min="50" max="2000" step="50" value="500" />
          </label>
          <label>
            <span>Density <output id="layer-2-density-value">0.003</output></span>
            <input id="layer-2-density" type="range" min="0" max="0.05" step="0.001" value="0.003" />
          </label>
        </details>
      </section>

      <section
        class="control-group"
        aria-labelledby="rendering-controls-heading"
      >
        <h2 id="rendering-controls-heading">Rendering</h2>

        <label>
          <span>Quality preset</span>
          <select id="quality-preset">
            <option value="low">Low</option>
            <option value="medium">Medium</option>
            <option value="high" selected>High</option>
            <option value="ultra">Ultra</option>
          </select>
        </label>

        <label>
          <span
            >Resolution scale
            <output id="resolution-scale-value">100%</output></span
          >
          <select id="resolution-scale">
            <option value="0.5">50%</option>
            <option value="0.75">75%</option>
            <option value="1" selected>100%</option>
          </select>
        </label>

        <label class="toggle">
          <span>Temporal upscaling</span>
          <input id="temporal-upscale" type="checkbox" checked />
        </label>

        <label class="toggle">
          <span>Shape detail</span>
          <input id="shape-detail" type="checkbox" checked />
        </label>

        <label class="toggle">
          <span>Turbulence</span>
          <input id="turbulence" type="checkbox" checked />
        </label>

        <label class="toggle">
          <span>Cloud shadows</span>
          <input id="cloud-shadows" type="checkbox" checked />
        </label>

        <label class="toggle">
          <span>Scene shadows</span>
          <input id="scene-shadows" type="checkbox" checked />
        </label>
      </section>

      <section
        class="control-group"
        aria-labelledby="lighting-controls-heading"
      >
        <h2 id="lighting-controls-heading">Lighting</h2>

        <label>
          <span
            >Sun detail samples
            <output id="sun-detail-value">2</output></span
          >
          <input
            id="sun-detail"
            type="range"
            min="0"
            max="4"
            step="1"
            value="2"
          />
        </label>

        <label>
          <span
            >March iterations
            <output id="march-iterations-value">500</output></span
          >
          <input
            id="march-iterations"
            type="range"
            min="32"
            max="768"
            step="16"
            value="500"
          />
        </label>

        <label>
          <span
            >Multi-scatter octaves
            <output id="multi-scatter-value">8</output></span
          >
          <input
            id="multi-scatter"
            type="range"
            min="1"
            max="12"
            step="1"
            value="8"
          />
        </label>

        <label>
          <span>Powder <output id="powder-scale-value">0.80</output></span>
          <input
            id="powder-scale"
            type="range"
            min="0"
            max="1"
            step="0.05"
            value="0.8"
          />
        </label>

        <label>
          <span
            >Ground bounce
            <output id="ground-bounce-value">1.00</output></span
          >
          <input
            id="ground-bounce"
            type="range"
            min="0"
            max="2"
            step="0.05"
            value="1"
          />
        </label>

        <label>
          <span>Phase function</span>
          <select id="phase-function">
            <option value="approximate" selected>Approximate</option>
            <option value="accurate">Accurate</option>
          </select>
        </label>

        <label>
          <span>Sun elevation <output id="sun-value">28°</output></span>
          <input
            id="sun-elevation"
            type="range"
            min="2"
            max="85"
            step="1"
            value="28"
          />
        </label>

        <label>
          <span>Exposure <output id="exposure-value">0.40</output></span>
          <input
            id="exposure"
            type="range"
            min="0.1"
            max="10"
            step="0.05"
            value="0.4"
          />
        </label>
      </section>

      <details class="control-group" id="diagnostics" open>
        <summary id="diagnostics-heading">Diagnostics</summary>

        <label>
          <span>Debug output</span>
          <select id="debug-output">
            <option value="none" selected>None (composited)</option>
            <option value="clouds">Cloud color</option>
            <option value="velocity">Velocity</option>
            <option value="shadow-cascade-0">Shadow cascade 0</option>
            <option value="shadow-cascade-1">Shadow cascade 1</option>
            <option value="shadow-cascade-2">Shadow cascade 2</option>
            <option value="optical-depth-local">Optical depth (local)</option>
            <option value="optical-depth-bsm">Optical depth (BSM)</option>
            <option value="no-shadow">No-shadow comparison</option>
          </select>
        </label>

        <label class="toggle">
          <span>Temporal history</span>
          <input id="temporal-history" type="checkbox" checked />
        </label>

        <button type="button" id="dump-wgsl">Dump WGSL</button>
        <p id="pass-stats" class="status" aria-live="polite">
          Pass sizes: —
        </p>
      </details>

      <p class="hint">Drag to orbit · Scroll to zoom</p>
    </aside>
    <section id="error" class="error" role="alert" hidden>
      <h2>Unable to start WebGPU</h2>
      <p id="error-message"></p>
    </section>

    <script type="module" src="/demo/main.ts"></script>
  </body>
</html>
