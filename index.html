<!-- index.html -->
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Standalone Three.js WebGPU volumetric clouds demo"
    />
    <title>WebGPU Clouds</title>
  </head>
  <body>
    <main id="app" aria-label="WebGPU clouds demo"></main>

    <aside class="panel" aria-label="Cloud controls">
      <header>
        <p class="eyebrow">Three.js WebGPU</p>
        <h1>Volumetric clouds</h1>
        <p id="status" class="status">Initializing WebGPU…</p>
      </header>

      <section class="control-group" aria-labelledby="cloud-controls-heading">
        <h2 id="cloud-controls-heading">Clouds</h2>

        <label>
          <span>Coverage <output id="coverage-value">0.40</output></span>
          <input
            id="coverage"
            type="range"
            min="0"
            max="1"
            step="0.01"
            value="0.4"
          />
        </label>

        <label class="toggle">
          <span>Animate weather</span>
          <input id="animate-weather" type="checkbox" />
        </label>
      </section>

      <section
        class="control-group"
        aria-labelledby="rendering-controls-heading"
      >
        <h2 id="rendering-controls-heading">Rendering</h2>

        <label>
          <span
            >Resolution scale
            <output id="resolution-scale-value">50%</output></span
          >
          <select id="resolution-scale">
            <option value="0.5" selected>50%</option>
            <option value="0.75">75%</option>
            <option value="1">100%</option>
          </select>
        </label>

        <label class="toggle">
          <span>Temporal upscaling</span>
          <input id="temporal-upscale" type="checkbox" checked />
        </label>

        <label class="toggle">
          <span>Shape detail</span>
          <input id="shape-detail" type="checkbox" />
        </label>

        <label class="toggle">
          <span>Turbulence</span>
          <input id="turbulence" type="checkbox" />
        </label>

        <label class="toggle">
          <span>Cloud shadows</span>
          <input id="cloud-shadows" type="checkbox" checked />
        </label>
      </section>

      <section
        class="control-group"
        aria-labelledby="lighting-controls-heading"
      >
        <h2 id="lighting-controls-heading">Lighting</h2>

        <label>
          <span>Sun elevation <output id="sun-value">28°</output></span>
          <input
            id="sun-elevation"
            type="range"
            min="2"
            max="85"
            step="1"
            value="28"
          />
        </label>

        <label>
          <span>Exposure <output id="exposure-value">0.40</output></span>
          <input
            id="exposure"
            type="range"
            min="0.1"
            max="10"
            step="0.05"
            value="0.4"
          />
        </label>
      </section>

      <p class="hint">Drag to orbit · Scroll to zoom</p>
    </aside>

    <section id="error" class="error" role="alert" hidden>
      <h2>Unable to start WebGPU</h2>
      <p id="error-message"></p>
    </section>

    <script type="module" src="/demo/main.ts"></script>
  </body>
</html>
